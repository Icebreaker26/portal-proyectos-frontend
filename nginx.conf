server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Resolver embebido de Docker + proxy_pass con variable: fuerza a nginx a resolver
    # "backend" en cada petición en vez de una sola vez al arrancar. Sin esto, si el
    # contenedor backend no está listo en el instante exacto en que arranca nginx (o se
    # reinicia después), nginx muere con "host not found in upstream" y no se recupera solo.
    resolver 127.0.0.11 valid=10s;

    location /api {
        set $backend_upstream http://backend:48500;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Requested-With $http_x_requested_with;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
